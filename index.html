<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Math Notes</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 1100px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; color: #111; }
        code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 6px; overflow-x: auto; }
        blockquote { border-left: 4px solid #0070f3; margin: 0; padding-left: 20px; color: #555; background: #f9f9f9; padding: 10px 20px; }

        /* Two-column layout: menu on the left, notes on the right */
        .layout { display: flex; gap: 40px; align-items: flex-start; }
        #nav { flex: 0 0 230px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; border-right: 1px solid #eee; padding-right: 16px; }
        #content { flex: 1; min-width: 0; }

        /* Menu */
        nav ul { list-style: none; padding-left: 16px; margin: 2px 0; }
        nav > ul { padding-left: 0; }
        nav li { margin: 4px 0; }
        nav a { color: #0070f3; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        nav a.active { color: #111; font-weight: 600; }

        /* Show/hide solutions */
        details { background: #f6f9ff; border: 1px solid #d6e4ff; border-radius: 6px; padding: 10px 16px; margin: 12px 0 24px; }
        summary { cursor: pointer; font-weight: 600; color: #0070f3; }
        details[open] summary { margin-bottom: 10px; }
        details[open] summary::after { content: " (click to hide)"; font-weight: normal; color: #888; font-size: 0.9em; }

        /* On phones, put the menu above the notes */
        @media (max-width: 700px) {
            .layout { flex-direction: column; gap: 20px; }
            #nav { position: static; flex-basis: auto; width: 100%; max-height: none; border-right: none; border-bottom: 1px solid #eee; padding: 0 0 12px; }
        }
    </style>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- LaTeX math renderer -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
</head>
<body>

    <div class="layout">
        <nav id="nav"></nav>
        <main id="content">Loading notes...</main>
    </div>

    <script>
        // 👉 Add each new .md file name here
        const PAGES = [
            'index.md',
            'derivatives.md',
            'derivatives/power-rule.md',
            'derivatives/chain-rule.md'
        ];

        // Splits a file into its front matter (meta) and the rest (body)
        function parseFrontMatter(text) {
            const meta = {};
            const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
            if (match) {
                match[1].split(/\r?\n/).forEach(line => {
                    const m = line.match(/^(\w+):\s*(.+)$/);
                    if (m) meta[m[1]] = m[2].trim();
                });
                text = text.slice(match[0].length);
            }
            return { meta, body: text };
        }

        Promise.all(PAGES.map(file =>
            fetch(file)
                .then(r => {
                    if (!r.ok) throw new Error(file + ' not found');
                    return r.text();
                })
                .then(text => {
                    // Cloudflare returns index.html for missing files
                    if (text.trimStart().toLowerCase().startsWith('<!doctype html')) {
                        throw new Error(file + ' not found (check the file name and folder)');
                    }
                    return { file, ...parseFrontMatter(text) };
                })
        ))
        .then(pages => {
            // Sort by navigation_weight (pages without one go last)
            const weight = p => Number(p.meta.navigation_weight) || 999;
            pages.sort((a, b) => weight(a) - weight(b));

            // The current page plus its parent, grandparent, etc.
            function openPath(page) {
                const open = new Set();
                while (page && !open.has(page.file)) {
                    open.add(page.file);
                    page = pages.find(p => p.file === page.meta.parent);
                }
                return open;
            }

            // Build the menu, only expanding sub-pages along the open path
            function buildMenu(parentFile, open, currentFile) {
                const children = pages.filter(p => (p.meta.parent || '') === parentFile);
                if (children.length === 0) return '';
                return '<ul>' + children.map(p => {
                    const active = p.file === currentFile ? ' class="active"' : '';
                    const sub = open.has(p.file) ? buildMenu(p.file, open, currentFile) : '';
                    return `<li><a href="#${p.file}"${active}>${p.meta.title || p.file}</a>${sub}</li>`;
                }).join('') + '</ul>';
            }

            // Show the page named in the URL (e.g. #derivatives.md), or the first one
            function show() {
                const file = decodeURIComponent(location.hash.slice(1));
                const page = pages.find(p => p.file === file) || pages[0];

                document.title = page.meta.title || 'My Math Notes';
                document.getElementById('nav').innerHTML = buildMenu('', openPath(page), page.file);

                if (window.MathJax && MathJax.typesetClear) MathJax.typesetClear();
                document.getElementById('content').innerHTML = marked.parse(page.body);
                if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();

                window.scrollTo(0, 0);
            }

            window.addEventListener('hashchange', show);
            show();
        })
        .catch(err => {
            console.error(err);
            document.getElementById('content').innerHTML = `<p>Error: ${err.message}</p>`;
        });
    </script>
</body>
</html>
