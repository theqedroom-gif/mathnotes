<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Math Notes</title>
    <!-- Simple, clean CSS styling -->
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; color: #111; }
        code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 6px; overflow-x: auto; }
        blockquote { border-left: 4px solid #0070f3; margin: 0; padding-left: 20px; color: #555; background: #f9f9f9; padding: 10px 20px; }
        nav ul { list-style: none; padding-left: 18px; margin: 4px 0; }
nav > ul { padding-left: 0; }
nav a { color: #0070f3; text-decoration: none; }
nav a:hover { text-decoration: underline; }
    </style>
    <!-- Load Markdown Parser (Marked) -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- Load LaTeX Math Renderer (MathJax) -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
</head>
<body>

    <!-- This is where your homepage markdown content will automatically display -->
    <nav id="nav" style="margin-bottom: 20px;"></nav>
<div id="content">Loading notes...</div>

<script>
    // 👉 Add each new .md file name here
    const PAGES = [
    'index.md',
    'derivatives.md',
    'derivatives/power-rule.md',
    'derivatives/chain-rule.md'
];
    // Splits a file into its front matter (meta) and the rest (body)
    function parseFrontMatter(text) {
        const meta = {};
        const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
        if (match) {
            match[1].split(/\r?\n/).forEach(line => {
                const m = line.match(/^(\w+):\s*(.+)$/);
                if (m) meta[m[1]] = m[2].trim();
            });
            text = text.slice(match[0].length);
        }
        return { meta, body: text };
    }

    Promise.all(PAGES.map(file =>
        fetch(file)
            .then(r => {
                if (!r.ok) throw new Error(file + ' not found');
                return r.text();
            })
            .then(text => ({ file, ...parseFrontMatter(text) }))
    ))
    .then(pages => {
        // Sort by navigation_weight (pages without one go last)
        const weight = p => Number(p.meta.navigation_weight) || 999;
        pages.sort((a, b) => weight(a) - weight(b));

       // Build a nested menu: each page appears under its "parent"
function buildMenu(parentFile) {
    const children = pages.filter(p => (p.meta.parent || '') === parentFile);
    if (children.length === 0) return '';
    return '<ul>' + children.map(p =>
        `<li><a href="#${p.file}">${p.meta.title || p.file}</a>${buildMenu(p.file)}</li>`
    ).join('') + '</ul>';
}
document.getElementById('nav').innerHTML = buildMenu('');// Build a nested menu: each page appears under its "parent"
function buildMenu(parentFile) {
    const children = pages.filter(p => (p.meta.parent || '') === parentFile);
    if (children.length === 0) return '';
    return '<ul>' + children.map(p =>
        `<li><a href="#${p.file}">${p.meta.title || p.file}</a>${buildMenu(p.file)}</li>`
    ).join('') + '</ul>';
}
document.getElementById('nav').innerHTML = buildMenu('');

        // Show the page named in the URL (e.g. #derivatives.md), or the first one
        function show() {
            const file = decodeURIComponent(location.hash.slice(1));
            const page = pages.find(p => p.file === file) || pages[0];
            document.title = page.meta.title || 'My Math Notes';
            if (window.MathJax && MathJax.typesetClear) MathJax.typesetClear();
            document.getElementById('content').innerHTML = marked.parse(page.body);
            if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
        }

        window.addEventListener('hashchange', show);
        show();
    })
    .catch(err => {
        console.error(err);
        document.getElementById('content').innerHTML = `<p>Error: ${err.message}</p>`;
    });
</script>
</body>
</html>
